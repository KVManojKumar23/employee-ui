<div class="emp-toolbar">
  <div class="actions">
    <mat-form-field appearance="outline" class="filter">
      <mat-label>Search Employee...</mat-label>
      <input matInput (input)="applyFilter($event)" placeholder="Type to search" />
      <button mat-icon-button matSuffix (click)="dataSource.filter=''">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>
</div>

<mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

<div class="table-wrap modern-table">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- SL No -->
    <ng-container matColumnDef="slno">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Sl No</th>
      <td mat-cell *matCellDef="let e; let i = index">{{ i + 1 }}</td>
    </ng-container>

    <ng-container matColumnDef="employeeId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Emp ID</th>
      <td mat-cell *matCellDef="let e">{{ e.employeeId }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let e">{{ e.name }}</td>
    </ng-container>

    <ng-container matColumnDef="designation">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Designation</th>
      <td mat-cell *matCellDef="let e">{{ e.designation }}</td>
    </ng-container>

    <ng-container matColumnDef="phoneNumber">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Phone</th>
      <td mat-cell *matCellDef="let e">{{ e.phoneNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="gender">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Gender</th>
      <td mat-cell *matCellDef="let e">
        <mat-chip class="chip-gender" color="primary" selected>
          {{ e.gender }}
        </mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let e">
        <mat-chip class="chip-status"
          [ngClass]="{ active: e.status === 'ACTIVE', inactive: e.status !== 'ACTIVE' }">
          {{ e.status }}
        </mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Department</th>
      <td mat-cell *matCellDef="let e">{{ e.department?.name }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let e" class="action-button">
         <button mat-icon-button color="accent" matTooltip="View Address" (click)="viewAddress(e.address)">
          <mat-icon>location_on</mat-icon>
        </button>
        <button mat-icon-button color="primary" matTooltip="Edit Employee" (click)="editEmployee(e)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" matTooltip="Delete Employee" (click)="deleteEmployee(e.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row class="row-hover" *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
</div>
