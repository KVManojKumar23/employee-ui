<h2 mat-dialog-title>
    {{ mode === 'Add' ? 'Add Department' : 'Edit Department' }}
</h2>

<mat-dialog-content>
    <form [formGroup]="form" class="dialog-form">

        <mat-form-field appearance="outline">
            <mat-label>Department Name</mat-label>
            <input matInput formControlName="name" />
            <mat-error *ngIf="form.controls['name'].hasError('required')">
                Name is required
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Department Code</mat-label>
            <mat-select formControlName="code">
                <mat-option *ngFor="let c of codes" [value]="c">
                    {{ c }}
                </mat-option>
            </mat-select>
            <mat-error *ngIf="form.controls['code'].hasError('required')">
                Code is required
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Description</mat-label>
            <textarea matInput rows="3" formControlName="description"></textarea>
        </mat-form-field>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="button-group">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="form.invalid">
        {{ mode === 'Add' ? 'Save' : 'Update' }}
    </button>
</mat-dialog-actions>
